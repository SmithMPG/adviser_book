<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyBook</title>
    <link rel="stylesheet" href="components/theme.css" />
    <link rel="stylesheet" href="components/toolbar.css" />
    <link rel="stylesheet" href="components/home-hero.css" />
    <link rel="stylesheet" href="components/stat-list.css" />
    <link rel="stylesheet" href="components/leaderboard.css" />
    <style>
      :root {
        --navy: #0f1729;
        --navy-light: #172234;
        --navy-lighter: #1e2a3f;
        --gold: #d4af37;
        --gold-soft: #e8c766;
        --text: #e8e8ea;
        --text-dim: #9aa3b2;
        --border: #2a3549;
        --green: #3ecf8e;
        --blue: #3b82f6;
        --red: #e85c5c;
        --radius: 6px;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #e5e5e5;
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }

      /* ===== Page ===== */
      .page {
        max-width: 1400px;
        margin: 0 auto;
        padding: 24px 28px 60px;
      }

      .tab-content {
        display: none;
      }
      .tab-content.active {
        display: block;
      }
    </style>
  </head>
  <body>
    <script src="constants.js"></script>
    <script src="components/month-bar.js"></script>
    <script src="components/checkout-popover.js"></script>
    <script src="components/pcr-meter.js"></script>
    <script src="components/client-funnel.js"></script>
    <script src="components/monthly-stats.js"></script>
    <script src="components/lifetime-badges.js"></script>
    <script src="components/client-tabs.js"></script>
    <script src="components/field-helpers.js"></script>
    <script src="components/editable-panel.js"></script>
    <script src="components/client-details.js"></script>
    <script src="components/client-cases.js"></script>
    <script src="components/client-card.js"></script>
    <script src="components/commission-calculator.js"></script>

    <!-- ===== Top bar ===== -->
    <div class="topbar">
      <div class="topbar-left">
        <div class="brand">
          <span class="shield">&#9830;</span>
          AdviserBook
        </div>
        <div id="lifetime-badges-container"></div>
      </div>
      <div class="topbar-center">
        <button class="btn-new">+ New Client</button>
        <div class="search-wrap">
          <span class="search-icon">&#8981;</span>
          <input class="search-input" type="search" placeholder="Search clients&hellip;" />
        </div>
        <button class="cc-trigger" id="commission-calc-trigger" title="Commission Calculator">
          <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="1" x2="12" y2="23" />
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
          </svg>
        </button>
      </div>
      <div class="topbar-right">
        <button class="profile-btn" title="Matthew PG Smith">MS</button>
        <span class="advisor-name">Matthew PG Smith</span>
        <button class="btn-signout">Sign out</button>
      </div>
    </div>

    <!-- ===== Tab bar ===== -->
    <div class="tab-bar">
      <div class="tab tab-icon active" data-tab="dashboard" title="Home">
        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7" />
          <path d="M4 10v10a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1V10" />
        </svg>
      </div>
      <div class="tab" data-tab="prospects">Prospects <span class="tab-count">2</span></div>
      <div class="tab" data-tab="action-required">Action Required <span class="tab-count">2</span></div>
      <div class="tab" data-tab="clients">Clients <span class="tab-count">2</span></div>
      <div class="tab tab-icon" data-tab="not-moved" title="Not Moved Forward">
        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <line x1="4.93" y1="4.93" x2="19.07" y2="19.07" />
        </svg>
        <span class="tab-count">1</span>
      </div>
    </div>

    <!-- Month progress bar (full width, only shown on the Home tab) -->
    <div class="month-bar-wrapper tab-content active" id="month-bar-wrapper">
      <div id="month-bar-container"></div>
    </div>

    <!-- Home hero: funnel, PCR meter (this cycle's hero, dead center), monthly stats.
       Full width like the month bar, only shown on the Home tab.
       Lifetime book-health numbers (AUM/Clients/Policies) live in the toolbar instead,
       so they're visible from every tab, not just Home. -->
    <div class="home-hero-wrapper tab-content active" id="home-hero-wrapper">
      <div class="home-hero">
        <div class="hero-col hero-col-funnel">
          <div id="client-funnel-container"></div>
        </div>
        <div class="hero-center">
          <div id="pcr-meter-container"></div>
        </div>
        <div class="hero-col hero-col-monthly">
          <div id="monthly-stats-container"></div>
        </div>
      </div>
    </div>

    <div class="page">
      <!-- ===== DASHBOARD TAB ===== -->
      <div class="tab-content active" id="tab-dashboard">
        <!-- Leaderboard -->
        <div class="leaderboard">
          <h4>Team Leaderboard &mdash; MTD</h4>
          <div class="lb-row lb-head">
            <div class="lb-rank"></div>
            <div class="lb-name"></div>
            <div class="lb-value">Cases</div>
            <div class="lb-value">PCR&rsquo;s</div>
          </div>
          <div class="lb-row">
            <div class="lb-rank top">1</div>
            <div class="lb-name">Robyn Hock</div>
            <div class="lb-value">7</div>
            <div class="lb-value">R820k</div>
          </div>
          <div class="lb-row">
            <div class="lb-rank top">2</div>
            <div class="lb-name">Matthew PG Smith (you)</div>
            <div class="lb-value">4</div>
            <div class="lb-value">R600k</div>
          </div>
          <div class="lb-row">
            <div class="lb-rank">3</div>
            <div class="lb-name">Willie Smith</div>
            <div class="lb-value">3</div>
            <div class="lb-value">R410k</div>
          </div>
        </div>
      </div>

      <!-- ===== PROSPECTS TAB ===== -->
      <div class="tab-content" id="tab-prospects">
        <div id="prospects-cards"></div>
      </div>

      <!-- ===== ACTION REQUIRED TAB ===== -->
      <div class="tab-content" id="tab-action-required">
        <div id="action-required-cards"></div>
      </div>

      <!-- ===== CLIENTS TAB ===== -->
      <div class="tab-content" id="tab-clients">
        <div id="clients-cards"></div>
      </div>

      <!-- ===== NOT MOVED FORWARD TAB ===== -->
      <div class="tab-content" id="tab-not-moved">
        <div id="not-moved-cards"></div>
      </div>
    </div>

    <script>
      initMonthBar("month-bar-container");
      initPcrMeter("pcr-meter-container", { periodLabel: getCurrentPeriodLabel() });
      initClientFunnel("client-funnel-container");
      initMonthlyStats("monthly-stats-container");
      initLifetimeBadges("lifetime-badges-container");
      initClientTabs(document);
      initClientCards(document);
      initCommissionCalculator("commission-calc-trigger");
      initEditablePanels(document);
      initClientCaseLists(document);

      // that actually have one.

      renderClientCards("clients-cards", [

      renderClientCards("not-moved-cards", [
        {

      // Tab switching
      function activateTab(tab) {
        document.querySelectorAll(".tab-bar .tab").forEach((t) => t.classList.remove("active"));
        tab.classList.add("active");
        document.querySelectorAll(".tab-content").forEach((c) => c.classList.remove("active"));
        document.getElementById("tab-" + tab.dataset.tab).classList.add("active");
        document.getElementById("month-bar-wrapper").classList.toggle("active", tab.dataset.tab === "dashboard");
        document.getElementById("home-hero-wrapper").classList.toggle("active", tab.dataset.tab === "dashboard");
      }
      document.querySelectorAll(".tab-bar .tab").forEach((tab) => {
        tab.addEventListener("click", () => activateTab(tab));
      });

      // Drag a card onto a tab heading to move it into that stage.
      // Delegated on document (rather than queried once at load) since
      // cards are rendered dynamically by renderClientCards.
      let draggedCard = null;

      document.addEventListener("dragstart", (e) => {
        const card = e.target.closest(".card-wrapper");
        if (!card) return;
        draggedCard = card;
        card.classList.add("dragging");
      });
      document.addEventListener("dragend", (e) => {
        const card = e.target.closest(".card-wrapper");
        if (!card) return;
        card.classList.remove("dragging");
        draggedCard = null;
      });

      function updateTabCount(tabContent) {
        if (!tabContent) return;
        const tab = document.querySelector('.tab[data-tab="' + tabContent.id.replace("tab-", "") + '"]');
        const countEl = tab && tab.querySelector(".tab-count");
        if (countEl) countEl.textContent = tabContent.querySelectorAll(".card-wrapper").length;
      }

      document.querySelectorAll('.tab-bar .tab[data-tab]:not([data-tab="dashboard"])').forEach((tab) => {
        tab.addEventListener("dragover", (e) => {
          if (!draggedCard) return;
          e.preventDefault();
          tab.classList.add("drag-over");
        });
        tab.addEventListener("dragleave", () => tab.classList.remove("drag-over"));
        tab.addEventListener("drop", (e) => {
          e.preventDefault();
          tab.classList.remove("drag-over");
          if (!draggedCard) return;
          const sourceTabContent = draggedCard.closest(".tab-content");
          const targetTabContent = document.getElementById("tab-" + tab.dataset.tab);
          if (!targetTabContent || sourceTabContent === targetTabContent) return;
          targetTabContent.appendChild(draggedCard);
          updateTabCount(sourceTabContent);
          updateTabCount(targetTabContent);
          activateTab(tab);
        });
      });
    </script>
  </body>
</html>
